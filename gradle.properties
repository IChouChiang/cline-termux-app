android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Several worktrees build in parallel during implementation: one JVM per build
# (Kotlin compiles inside the Gradle daemon), shared local build cache, and idle
# daemons exit after three minutes instead of three hours.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.daemon.idletimeout=180000
